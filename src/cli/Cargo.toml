[package]
name = "xbox-recomp2-cli"
# Not yet released, don't bump this.
version = "0.1.0"
edition = "2024"
description = "CLI for Rust port of the XboxRecomp x86-to-C++ recompiler (code generator only)"
repository = "https://github.com/Sewer56/XboxRecomp2"
license-file = "LICENSE"
# keywords (search terms): https://crates.io/keywords
keywords = ["cli", "command-line", "xbox", "recompiler", "emulation"]
# categories (fixed list): https://crates.io/categories
categories = ["command-line-utilities", "emulators", "development-tools"]

[[bin]]
name = "xboxrecomp2"
path = "src/main.rs"

[dependencies]
xbox-recomp2 = { path = "../xbox-recomp2", version = "0.1.0" }
xbox-recomp2-xbox = { path = "../xbox-recomp2-xbox", version = "0.1.0" }
argh = { version = "0.1.19", default-features = false, features = ["help"] }

[lints]
workspace = true
