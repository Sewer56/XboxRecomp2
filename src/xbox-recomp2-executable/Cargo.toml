[package]
name = "xbox-recomp2-executable"
version = "0.2.0"
edition = "2024"
description = "Shared model of a guest executable, independent of any single input format"
repository = "https://github.com/Sewer56/XboxRecomp2"
license-file = "LICENSE"
# keywords (search terms): https://crates.io/keywords
keywords = ["x86", "recompiler", "transpiler", "emulation", "executable"]
# categories (fixed list): https://crates.io/categories
categories = ["compilers", "emulators", "development-tools"]

[dependencies]
ahash = "0.8"
bitflags = "2"
derive_more = { version = "2", features = ["from", "into"] }
endian-writer = "2.3.0"
endian-writer-derive = "0.2.0"

[lints]
workspace = true

[dev-dependencies]
rstest = "0.28.0"
